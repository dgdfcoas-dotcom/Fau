<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalia's Beautiful - Atendimento</title>
    <style>
        /* Estilos de Design Elegante */
        body {
            font-family: 'Playfair Display', serif, Arial;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fdf6f6; /* Fundo suave */
            color: #4a4a4a;
        }

        .container {
            text-align: center;
            max-width: 450px;
            padding: 50px 30px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            margin: 20px;
        }

        .logo-text {
            font-size: 2.5rem;
            color: #d4a373; /* Tom dourado/bronze */
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 30px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        p {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #666;
        }

        /* Botão Elegante do WhatsApp */
        .cta-button {
            display: inline-block;
            background-color: #25D366; /* Mantendo a cor oficial para reconhecimento imediato */
            color: white;
            text-decoration: none;
            padding: 20px 40px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px; /* Estilo mais retangular e moderno */
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(37, 211, 102, 0.3);
            background-color: #1ebd5b;
        }

        footer {
            margin-top: 40px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #ccc;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-text">dalia's beautiful</div>
        <h1>Beleza e Cuidado</h1>
        
        <p>Descubra uma nova forma de realçar sua essência. Clique abaixo para agendar seu horário ou tirar dúvidas pelo nosso canal exclusivo.</p>

        <a href="https://wa.me/5500000000000?text=Olá!%20Vim%20pela%20página%20Dalia's%20Beautiful%20e%20gostaria%20de%20informações." class="cta-button">
            AGENDAR VIA WHATSAPP
        </a>

        <footer>
            &copy; 2026 dalia's beautiful
        </footer>
    </div>

</body>
</html>
